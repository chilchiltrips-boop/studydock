name: StudyDock Production Signed APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Integer higher than every previously installed version code"
        type: string
        required: true
      version_name:
        description: "Release label, for example 1.0.0"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: studydock-production-signing
  cancel-in-progress: false

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate required signing secrets, fingerprint and release inputs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDYDOCK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STUDYDOCK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STUDYDOCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STUDYDOCK_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.STUDYDOCK_SIGNING_CERT_SHA256 }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (( VERSION_CODE <= 5 )); then
            echo "::error::version_code must be an integer greater than 3 and higher than all prior installs"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,39}$ ]]; then
            echo "::error::Invalid version_name"
            exit 1
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing StudyDock signing secrets"
            exit 1
          fi
          EXPECTED_CLEAN="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]')"
          if ! [[ "$EXPECTED_CLEAN" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Set STUDYDOCK_SIGNING_CERT_SHA256 repository variable"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run existing tests
        run: |
          node --test tests/model.test.mjs
          python3 tests/test_native_project_contract.py
          python3 tests/test_guided_learning.py

      - name: Decode production keystore into temporary runner storage
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDYDOCK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studydock-release.jks"
          test -s "$RUNNER_TEMP/studydock-release.jks"

      - name: Build signed release APK
        env:
          STUDYDOCK_KEYSTORE_FILE: ${{ runner.temp }}/studydock-release.jks
          STUDYDOCK_KEYSTORE_PASSWORD: ${{ secrets.STUDYDOCK_KEYSTORE_PASSWORD }}
          STUDYDOCK_KEY_ALIAS: ${{ secrets.STUDYDOCK_KEY_ALIAS }}
          STUDYDOCK_KEY_PASSWORD: ${{ secrets.STUDYDOCK_KEY_PASSWORD }}
          STUDYDOCK_VERSION_CODE: ${{ inputs.version_code }}
          STUDYDOCK_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Verify signature, expected certificate, app ID and version
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.STUDYDOCK_SIGNING_CERT_SHA256 }}
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/studydock-apk-signature.txt"
          OBSERVED="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: *([[:xdigit:]]+).*$/\1/p' "$RUNNER_TEMP/studydock-apk-signature.txt" | head -n1)"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]')"
          OBSERVED_LOWER="$(printf '%s' "$OBSERVED" | tr '[:upper:]' '[:lower:]')"
          EXPECTED_LOWER="$(printf '%s' "$EXPECTED" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$OBSERVED" || "$OBSERVED_LOWER" != "$EXPECTED_LOWER" ]]; then
            echo "::error::APK signer SHA-256 does not match configured certificate"
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          if [[ "$BADGING" != *"name='com.studydock.learning'"* ]] ||
             [[ "$BADGING" != *"versionCode='$EXPECTED_VERSION_CODE'"* ]]; then
            echo "::error::Application ID or versionCode mismatch"
            exit 1
          fi
          echo "Signed APK certificate, app ID and versionCode verified"

      - name: Upload verified production APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyDock-Production-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/studydock-release.jks"
