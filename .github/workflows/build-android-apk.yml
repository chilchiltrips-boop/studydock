name: Build StudyDock Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out StudyDock project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm preinstalled Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          command -v sdkmanager

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run question model unit tests
        run: node --test tests/model.test.mjs

      - name: Sync latest web app into the Android project
        run: bash scripts/sync-android-assets.sh

      - name: Compile installable debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Publish downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyDock-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
