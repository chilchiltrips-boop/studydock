name: Build StudyDock Native Android APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/build-android-apk.yml'
jobs:
  native-android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify existing quiz model
        run: node --test tests/model.test.mjs
      - name: Verify native Android source contract
        run: python3 tests/test_native_project_contract.py
      - name: Check online learning modules
        run: python3 tests/test_guided_learning.py
      - name: Verify private NCLEX pack converter and safety flags
        run: python3 tests/test_nclex_local_pack.py
      - name: Build native APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify APK signature and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          if [[ "$BADGING" != *"name='com.studydock.learning'"* ]] ||
             [[ "$BADGING" != *"versionCode='6'"* ]]; then
            echo "::error::Unexpected StudyDock application ID or versionCode"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: StudyDock-Native-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Archive complete public source tree
        run: git archive --format=zip -o StudyDock_Public_Source_snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: StudyDock-Native-Source-snapshot
          path: StudyDock_Public_Source_snapshot.zip
          if-no-files-found: error
          retention-days: 30
